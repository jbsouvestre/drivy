# Release: push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`).
# Builds the game, attaches a zip of the build to a GitHub Release, and
# deploys the same build to GitHub Pages.
name: Release

on:
  push:
    tags: ['v*']
  # Manual run from the Actions tab: redeploys Pages from the chosen ref (no release).
  workflow_dispatch:

permissions:
  contents: write # create the release
  pages: write # deploy to Pages
  id-token: write # required by deploy-pages
  actions: read # required by deploy-pages (v4+)

# Never run two deployments at once; don't cancel one that's in progress.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # Node 24 LTS
          cache: npm

      - name: Read game version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${{ steps.version.outputs.version }}"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Zip the build
        run: cd dist && zip -r "../drivy-v${{ steps.version.outputs.version }}.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: drivy-v${{ steps.version.outputs.version }}.zip

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "drivy-v${{ needs.build.outputs.version }}.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Drivy v${{ needs.build.outputs.version }}" \
            --generate-notes

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
